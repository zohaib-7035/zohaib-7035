<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Zohaib Shahid, Data Scientist and AI Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0f1d38"/>
    </linearGradient>
    <linearGradient id="shine" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#f8fafc"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="-0.2" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.2;1.2" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.4" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14213b" stroke-width="1"/>
    </pattern>
    <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="340">
      <rect x="60" y="232" width="0" height="44" fill="#fff">
        <animate attributeName="width" values="0;620;620;0;0" keyTimes="0;0.2;0.3;0.31;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="340">
      <rect x="60" y="232" width="0" height="44" fill="#fff">
        <animate attributeName="width" values="0;0;690;690;0;0" keyTimes="0;0.333;0.533;0.633;0.643;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </mask>
    <mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="340">
      <rect x="60" y="232" width="0" height="44" fill="#fff">
        <animate attributeName="width" values="0;0;500;500;0;0" keyTimes="0;0.667;0.867;0.967;0.977;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </mask>
  </defs>
  <style>
    .title { font: 700 72px 'Segoe UI', Arial, Helvetica, sans-serif; animation: rise 1.2s ease-out both; }
    .eyebrow { font: 500 18px Consolas, 'Fira Code', 'Courier New', monospace; fill: #38bdf8; animation: rise 0.8s ease-out both; }
    .sub { font: 500 24px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #94a3b8; animation: rise 1.2s 0.2s ease-out both; }
    .typed { font: 500 22px Consolas, 'Fira Code', 'Courier New', monospace; fill: #7dd3fc; }
    .e { stroke: #1e3a5f; stroke-width: 1.2; stroke-dasharray: 3 5; animation: flow 1.6s linear infinite; }
    .n { fill: #0b1020; stroke: #38bdf8; stroke-width: 2; animation: pulse 3s ease-in-out infinite; }
    .orbit { fill: none; stroke: #1e3a5f; stroke-width: 1.2; stroke-dasharray: 3 9; transform-box: view-box; transform-origin: 930px 170px; animation: spin 40s linear infinite; }
    .star { fill: #e2e8f0; animation: twinkle 3s ease-in-out infinite; }
    .glyph { font: 600 30px Consolas, 'Fira Code', monospace; fill: #334155; animation: drift 9s ease-in-out infinite alternate; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-16px); } }
  </style>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>

  <circle class="star" cx="36" cy="36" r="1.4" style="animation-delay:0s"/>
  <circle class="star" cx="150" cy="30" r="1.1" style="animation-delay:0.9s"/>
  <circle class="star" cx="300" cy="54" r="1.6" style="animation-delay:1.7s"/>
  <circle class="star" cx="470" cy="26" r="1.2" style="animation-delay:0.4s"/>
  <circle class="star" cx="610" cy="60" r="1.3" style="animation-delay:2.2s"/>
  <circle class="star" cx="700" cy="24" r="1.5" style="animation-delay:1.1s"/>
  <circle class="star" cx="40" cy="300" r="1.2" style="animation-delay:0.6s"/>
  <circle class="star" cx="360" cy="312" r="1.4" style="animation-delay:1.9s"/>
  <circle class="star" cx="560" cy="296" r="1.1" style="animation-delay:2.6s"/>
  <circle class="star" cx="1150" cy="30" r="1.3" style="animation-delay:1.3s"/>

  <text class="glyph" x="650" y="112" style="animation-delay:0s">{ }</text>
  <text class="glyph" x="620" y="318" style="animation-delay:-4s">f(x)</text>

  <text class="eyebrow" x="70" y="92">// hi, I'm</text>
  <text class="title" x="66" y="170" fill="url(#shine)" filter="url(#glow)">Zohaib Shahid</text>
  <text class="sub" x="70" y="212">Data Scientist  |  AI Developer</text>
  <text class="typed" mask="url(#m1)" x="70" y="262">&gt; Turning raw data into real-world solutions</text>
  <text class="typed" mask="url(#m2)" x="70" y="262">&gt; Building AI for farmers, patients and investors</text>
  <text class="typed" mask="url(#m3)" x="70" y="262">&gt; Debugging with a smile and a laugh</text>

  <circle class="orbit" cx="930" cy="170" r="150"/>

  <line class="e" x1="840" y1="110" x2="930" y2="80"/>
  <line class="e" x1="840" y1="110" x2="930" y2="140"/>
  <line class="e" x1="840" y1="110" x2="930" y2="200"/>
  <line class="e" x1="840" y1="110" x2="930" y2="260"/>
  <line class="e" x1="840" y1="170" x2="930" y2="80"/>
  <line class="e" x1="840" y1="170" x2="930" y2="140"/>
  <line class="e" x1="840" y1="170" x2="930" y2="200"/>
  <line class="e" x1="840" y1="170" x2="930" y2="260"/>
  <line class="e" x1="840" y1="230" x2="930" y2="80"/>
  <line class="e" x1="840" y1="230" x2="930" y2="140"/>
  <line class="e" x1="840" y1="230" x2="930" y2="200"/>
  <line class="e" x1="840" y1="230" x2="930" y2="260"/>
  <line class="e" x1="930" y1="80" x2="1020" y2="110"/>
  <line class="e" x1="930" y1="80" x2="1020" y2="170"/>
  <line class="e" x1="930" y1="80" x2="1020" y2="230"/>
  <line class="e" x1="930" y1="140" x2="1020" y2="110"/>
  <line class="e" x1="930" y1="140" x2="1020" y2="170"/>
  <line class="e" x1="930" y1="140" x2="1020" y2="230"/>
  <line class="e" x1="930" y1="200" x2="1020" y2="110"/>
  <line class="e" x1="930" y1="200" x2="1020" y2="170"/>
  <line class="e" x1="930" y1="200" x2="1020" y2="230"/>
  <line class="e" x1="930" y1="260" x2="1020" y2="110"/>
  <line class="e" x1="930" y1="260" x2="1020" y2="170"/>
  <line class="e" x1="930" y1="260" x2="1020" y2="230"/>

  <circle class="n" cx="840" cy="110" r="7" style="animation-delay:0s"/>
  <circle class="n" cx="840" cy="170" r="7" style="animation-delay:0.6s"/>
  <circle class="n" cx="840" cy="230" r="7" style="animation-delay:1.2s"/>
  <circle class="n" cx="930" cy="80" r="7" style="animation-delay:0.3s"/>
  <circle class="n" cx="930" cy="140" r="7" style="animation-delay:0.9s"/>
  <circle class="n" cx="930" cy="200" r="7" style="animation-delay:1.5s"/>
  <circle class="n" cx="930" cy="260" r="7" style="animation-delay:2.1s"/>
  <circle class="n" cx="1020" cy="110" r="7" style="animation-delay:0.2s"/>
  <circle class="n" cx="1020" cy="170" r="7" style="animation-delay:0.8s"/>
  <circle class="n" cx="1020" cy="230" r="7" style="animation-delay:1.4s"/>

  <circle r="3.5" cx="0" cy="0" fill="#e0f2fe" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M840,110 L930,140 L1020,170"/>
  </circle>
  <circle r="3.5" cx="0" cy="0" fill="#e0f2fe" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M840,230 L930,200 L1020,110"/>
  </circle>
  <circle r="3.5" cx="0" cy="0" fill="#e0f2fe" filter="url(#glow)">
    <animateMotion dur="2.6s" begin="1.4s" repeatCount="indefinite" path="M840,170 L930,260 L1020,230"/>
  </circle>
  <circle r="3.5" cx="0" cy="0" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M840,170 L930,80 L1020,110"/>
  </circle>
  <circle r="3.5" cx="0" cy="0" fill="#7dd3fc" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="2s" repeatCount="indefinite" path="M840,230 L930,140 L1020,230"/>
  </circle>

  <rect x="24" y="334" width="1152" height="5" rx="2.5" fill="url(#scan)"/>
</svg>
