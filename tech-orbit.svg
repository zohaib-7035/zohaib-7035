<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Tools orbiting a glowing core: Python, PyTorch, Flask, React, TensorFlow, Streamlit, Supabase, TypeScript, scikit-learn and Tailwind">
  <defs>
    <radialGradient id="bgGlow" cx="400" cy="200" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12264a"/>
      <stop offset="0.6" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#070b18"/>
    </radialGradient>
    <linearGradient id="sweepFill" x1="400" y1="200" x2="568" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#132340" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .lbl { font: 500 13px Consolas, 'Fira Code', monospace; fill: #475569; }
    .ring { fill: none; stroke: #1e3a5f; stroke-width: 1.2; stroke-dasharray: 3 9; }
    .spk { stroke: #38bdf8; stroke-opacity: 0.32; stroke-width: 1.2; stroke-dasharray: 2 6; animation: flow 1.2s linear infinite; }
    .sweep { transform-box: view-box; transform-origin: 400px 200px; animation: spin 9s linear infinite; }
    .arc { fill: none; stroke: url(#arcGrad); stroke-width: 2.4; stroke-linecap: round; transform-box: view-box; transform-origin: 400px 200px; animation: spin 16s linear infinite; }
    .ping { fill: none; stroke: #38bdf8; stroke-width: 1.5; }
    .core { font: 700 24px Consolas, 'Fira Code', monospace; fill: #e0f2fe; }
    .tag { font: 600 13px Consolas, 'Fira Code', monospace; }
    .pill { fill: #0b1020; stroke-width: 1.6; }
    .star { fill: #e2e8f0; animation: twinkle 3s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flow { to { stroke-dashoffset: -8; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>

  <rect width="800" height="400" rx="22" fill="url(#bgGlow)"/>
  <rect width="800" height="400" rx="22" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.75" y="0.75" width="798.5" height="398.5" rx="21.5" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <circle class="star" cx="60" cy="90" r="1.3" style="animation-delay:0s"/>
  <circle class="star" cx="735" cy="60" r="1.5" style="animation-delay:1.1s"/>
  <circle class="star" cx="760" cy="300" r="1.2" style="animation-delay:0.5s"/>
  <circle class="star" cx="70" cy="300" r="1.4" style="animation-delay:1.8s"/>
  <circle class="star" cx="250" cy="22" r="1.1" style="animation-delay:2.4s"/>
  <circle class="star" cx="650" cy="372" r="1.2" style="animation-delay:0.9s"/>

  <text class="lbl" x="26" y="36" style="fill:#64748b;">stack.orbit()</text>
  <text class="lbl" x="26" y="376">// toolkit, in orbit</text>

  <circle class="ring" cx="400" cy="200" r="105"/>
  <circle class="ring" cx="400" cy="200" r="172"/>

  <!-- spokes carry data inward toward the core -->
  <line class="spk" x1="560" y1="200" x2="440" y2="200"/>
  <line class="spk" x1="538.6" y1="280" x2="434.6" y2="220"/>
  <line class="spk" x1="480" y1="338.6" x2="420" y2="234.6"/>
  <line class="spk" x1="400" y1="360" x2="400" y2="240"/>
  <line class="spk" x1="320" y1="338.6" x2="380" y2="234.6"/>
  <line class="spk" x1="261.4" y1="280" x2="365.4" y2="220"/>
  <line class="spk" x1="240" y1="200" x2="360" y2="200"/>
  <line class="spk" x1="261.4" y1="120" x2="365.4" y2="180"/>
  <line class="spk" x1="320" y1="61.4" x2="380" y2="165.4"/>
  <line class="spk" x1="400" y1="40" x2="400" y2="160"/>
  <line class="spk" x1="480" y1="61.4" x2="420" y2="165.4"/>
  <line class="spk" x1="538.6" y1="120" x2="434.6" y2="180"/>

  <path class="sweep" d="M400,200 L567.7,121.8 A185,185 0 0 1 567.7,278.2 Z" fill="url(#sweepFill)"/>
  <path class="arc" d="M495,35.5 A190,190 0 0 1 495,364.5"/>

  <circle class="ping" cx="400" cy="200" r="36">
    <animate attributeName="r" values="36;96" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle class="ping" cx="400" cy="200" r="36">
    <animate attributeName="r" values="36;96" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="400" cy="200" r="36" fill="#0b1020" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <text class="core" x="400" y="208" text-anchor="middle">ZS</text>

  <!-- outer orbit: six tools, counter-clockwise, 36s per lap -->
  <g filter="url(#glow)">
    <animateMotion dur="36s" begin="-3s" repeatCount="indefinite" path="M572,200 A172,172 0 1 0 228,200 A172,172 0 1 0 572,200"/>
    <rect class="pill" x="-49" y="-13" width="98" height="26" rx="13" stroke="#fb923c"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#fb923c">TensorFlow</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="36s" begin="-9s" repeatCount="indefinite" path="M572,200 A172,172 0 1 0 228,200 A172,172 0 1 0 572,200"/>
    <rect class="pill" x="-46" y="-13" width="92" height="26" rx="13" stroke="#f43f5e"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#f43f5e">Streamlit</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="36s" begin="-15s" repeatCount="indefinite" path="M572,200 A172,172 0 1 0 228,200 A172,172 0 1 0 572,200"/>
    <rect class="pill" x="-42" y="-13" width="84" height="26" rx="13" stroke="#3ecf8e"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#3ecf8e">Supabase</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="36s" begin="-21s" repeatCount="indefinite" path="M572,200 A172,172 0 1 0 228,200 A172,172 0 1 0 572,200"/>
    <rect class="pill" x="-49" y="-13" width="98" height="26" rx="13" stroke="#60a5fa"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#60a5fa">TypeScript</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="36s" begin="-27s" repeatCount="indefinite" path="M572,200 A172,172 0 1 0 228,200 A172,172 0 1 0 572,200"/>
    <rect class="pill" x="-38" y="-13" width="76" height="26" rx="13" stroke="#f59e0b"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#f59e0b">sklearn</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="36s" begin="-33s" repeatCount="indefinite" path="M572,200 A172,172 0 1 0 228,200 A172,172 0 1 0 572,200"/>
    <rect class="pill" x="-42" y="-13" width="84" height="26" rx="13" stroke="#38bdf8"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#38bdf8">Tailwind</text>
  </g>

  <!-- inner orbit: four core tools, clockwise, 24s per lap -->
  <g filter="url(#glow)">
    <animateMotion dur="24s" begin="0s" repeatCount="indefinite" path="M505,200 A105,105 0 1 1 295,200 A105,105 0 1 1 505,200"/>
    <rect class="pill" x="-35" y="-13" width="70" height="26" rx="13" stroke="#fde047"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#fde047">Python</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="24s" begin="-6s" repeatCount="indefinite" path="M505,200 A105,105 0 1 1 295,200 A105,105 0 1 1 505,200"/>
    <rect class="pill" x="-38" y="-13" width="76" height="26" rx="13" stroke="#f97316"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#f97316">PyTorch</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="24s" begin="-12s" repeatCount="indefinite" path="M505,200 A105,105 0 1 1 295,200 A105,105 0 1 1 505,200"/>
    <rect class="pill" x="-31" y="-13" width="62" height="26" rx="13" stroke="#e2e8f0"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#e2e8f0">Flask</text>
  </g>
  <g filter="url(#glow)">
    <animateMotion dur="24s" begin="-18s" repeatCount="indefinite" path="M505,200 A105,105 0 1 1 295,200 A105,105 0 1 1 505,200"/>
    <rect class="pill" x="-31" y="-13" width="62" height="26" rx="13" stroke="#61dafb"/>
    <text class="tag" x="0" y="4.5" text-anchor="middle" fill="#61dafb">React</text>
  </g>
</svg>
