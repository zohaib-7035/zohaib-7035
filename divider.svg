<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" role="img" aria-label="Animated data-flow divider">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .lbl { font: 500 12px Consolas, 'Fira Code', monospace; fill: #475569; letter-spacing: 1px; }
    .flow { stroke: #38bdf8; stroke-opacity: 0.45; stroke-width: 1.5; stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }
    .n { fill: #0b1020; stroke: #38bdf8; stroke-width: 1.6; animation: pulse 3s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="90" rx="18" fill="#070b18" stroke="#14213b" stroke-width="1.5"/>
  <line x1="40" y1="40" x2="1160" y2="40" stroke="#13294a" stroke-width="1"/>
  <line x1="40" y1="40" x2="1160" y2="40" stroke="url(#track)" stroke-width="2"/>
  <line class="flow" x1="40" y1="40" x2="1160" y2="40"/>

  <circle class="n" cx="120" cy="40" r="5" style="animation-delay:0s"/>
  <circle class="n" cx="300" cy="40" r="5" style="animation-delay:0.6s"/>
  <circle class="n" cx="480" cy="40" r="5" style="animation-delay:1.2s"/>
  <circle class="n" cx="720" cy="40" r="5" style="animation-delay:1.8s"/>
  <circle class="n" cx="900" cy="40" r="5" style="animation-delay:2.4s"/>
  <circle class="n" cx="1080" cy="40" r="5" style="animation-delay:0.3s"/>

  <circle cx="600" cy="40" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5">
    <animate attributeName="r" values="12;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="40" r="12" fill="#0b1020" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <circle cx="600" cy="40" r="4" fill="#e0f2fe" filter="url(#glow)"/>

  <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M40,40 L1160,40"/>
  </circle>
  <circle r="3.5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="5s" begin="1s" repeatCount="indefinite" path="M1160,40 L40,40"/>
  </circle>
  <circle r="3" fill="#f472b6" filter="url(#glow)">
    <animateMotion dur="6s" begin="2.5s" repeatCount="indefinite" path="M40,40 L1160,40"/>
  </circle>

  <text class="lbl" x="600" y="80" text-anchor="middle">data → model → insight</text>
</svg>
