<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Animated training loss curves from a demo model run">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .lbl { font: 500 14px Consolas, 'Fira Code', monospace; fill: #94a3b8; }
    .title { font: 500 15px Consolas, 'Fira Code', monospace; fill: #e2e8f0; }
    .r { font: 500 16px Consolas, 'Fira Code', monospace; fill: #7dd3fc; animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .r1 { animation-name: r1; }
    .r2 { animation-name: r2; }
    .r3 { animation-name: r3; }
    .r4 { animation-name: r4; }
    .axis { stroke: #334155; stroke-width: 1.5; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 2 6; }
    .area { fill: url(#area); animation: fadeArea 7s ease-in-out infinite; }
    .train { fill: none; stroke: #38bdf8; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 7s ease-in-out infinite; }
    .valid { fill: none; stroke: #f472b6; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 7s ease-in-out 0.3s infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 100; opacity: 1; } 65% { stroke-dashoffset: 0; opacity: 1; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes fadeArea { 0%, 10% { opacity: 0; } 60% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes r1 { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 24.9% { opacity: 0; } 25%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 49.9% { opacity: 0; } 50%, 74.9% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes r4 { 0%, 74.9% { opacity: 0; } 75%, 100% { opacity: 1; } }
  </style>

  <rect x="10" y="10" width="780" height="320" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text class="title" x="36" y="38">training run (demo)</text>
  <line x1="430" y1="34" x2="456" y2="34" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <text class="lbl" x="464" y="39">train</text>
  <line x1="530" y1="34" x2="556" y2="34" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
  <text class="lbl" x="564" y="39">validation</text>
  <text class="r r1" x="740" y="68" text-anchor="end">loss 0.912</text>
  <text class="r r2" x="740" y="68" text-anchor="end">loss 0.418</text>
  <text class="r r3" x="740" y="68" text-anchor="end">loss 0.187</text>
  <text class="r r4" x="740" y="68" text-anchor="end">loss 0.094</text>

  <line class="grid" x1="60" y1="130" x2="740" y2="130"/>
  <line class="grid" x1="60" y1="190" x2="740" y2="190"/>
  <line class="grid" x1="60" y1="250" x2="740" y2="250"/>
  <line class="axis" x1="60" y1="80" x2="60" y2="292"/>
  <line class="axis" x1="60" y1="292" x2="740" y2="292"/>
  <text class="lbl" x="66" y="92">loss</text>
  <text class="lbl" x="60" y="314">epoch 1</text>
  <text class="lbl" x="740" y="314" text-anchor="end">epoch 40</text>

  <path class="area" d="M60,80 C110,200 200,238 300,252 S600,270 740,274 L740,292 L60,292 Z"/>
  <path id="validPath" class="valid" pathLength="100" d="M60,72 C110,192 200,226 300,240 S600,256 740,262"/>
  <path id="trainPath" class="train" pathLength="100" d="M60,80 C110,200 200,238 300,252 S600,270 740,274" filter="url(#glow)"/>

  <g>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.65;1">
      <mpath href="#trainPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" dur="7s" repeatCount="indefinite"/>
    <circle r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle r="5" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="5;14" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.65;1">
      <mpath href="#validPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" dur="7s" repeatCount="indefinite"/>
    <circle r="4" fill="#f472b6" filter="url(#glow)"/>
  </g>
</svg>
